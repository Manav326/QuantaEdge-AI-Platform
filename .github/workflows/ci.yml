name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: pytest -q
      - name: Validate Docker Compose files
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-only-compose-validation
          CLOUDFLARE_TUNNEL_TOKEN_FILE: ${{ runner.temp }}/cloudflare-tunnel-token
        run: |
          touch "$CLOUDFLARE_TUNNEL_TOKEN_FILE"
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.harness.yml config --quiet
