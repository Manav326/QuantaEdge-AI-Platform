name: quantaedge-ai-platform

# FastAPI, the ARQ worker and Ollama run natively on Windows.
# PostgreSQL and Redis use loopback-only published ports.
# cloudflared uses Docker Desktop host networking to reach Windows loopback.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantaedge_ai}
      POSTGRES_USER: ${POSTGRES_USER:-qeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run initialization first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qeai} -d ${POSTGRES_DB:-quantaedge_ai}"]
      interval: 5s
      timeout: 5s
      retries: 25
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quantaedge-cloudflared
    profiles: ["cloudflare"]
    restart: unless-stopped
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  postgres_data:
  redis_data:

secrets:
  cloudflare_tunnel_token:
    file: D:/QuantaEdgeAI/secrets/cloudflare-tunnel.token

networks:
  private:
    driver: bridge